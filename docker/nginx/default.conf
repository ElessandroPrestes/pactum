map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 20M;

    # DNS interno do Docker — re-resolve o IP dos containers a cada request,
    # evitando 502 quando containers (app, frontend) sao recriados.
    resolver 127.0.0.11 valid=10s;

    # --- API Laravel (PHP-FPM) -------------------------------------------------
    # /api, /sanctum e /health caem no front controller do Laravel.
    location ^~ /api/ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location = /health {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- SPA Vue (Vite dev server) --------------------------------------------
    # Tudo o que nao bateu nas rotas acima vai para o Vite. O upgrade de
    # WebSocket e necessario para o HMR do Vite funcionar atras do proxy.
    location / {
        set $vite frontend:5173;
        proxy_pass http://$vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
