name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instala commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Valida mensagens dos commits do PR
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  quality:
    name: Lint e analise estatica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pcntl
          tools: composer:v2
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instala dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: PHPStan nivel 8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  test:
    name: Testes
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pactum_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Configura PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, bcmath, intl, pcntl
          tools: composer:v2
          coverage: pcov

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instala dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepara ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Executa os testes com cobertura minima de 90 por cento
        run: vendor/bin/pest --coverage --min=90
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pactum_testing
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pactum_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Configura PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, bcmath, intl, pcntl
          tools: composer:v2
          coverage: pcov

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instala dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepara ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/infection

      - name: Executa Infection com gate de MSI
        run: vendor/bin/infection --min-msi=70 --min-covered-msi=80 --threads=2 --no-progress --no-interaction
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pactum_testing
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  security:
    name: Scan de vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Trivy dockerfile scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  docker-build:
    name: Build Docker target prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build do estagio prod sem push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
